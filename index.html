<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌍 AI Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', 'Noto Sans Tamil', sans-serif;
      background: linear-gradient(135deg, #ff7e5f, #7f00ff);
      color: #fff;
      text-align: center;
      padding: 40px;
      min-height: 100vh;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ffb347, #ffcc33);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255, 200, 100, 0.5);
    }
    .box {
      background-color: rgba(255, 255, 255, 0.08);
      padding: 30px;
      border-radius: 15px;
      width: 70%;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(255, 130, 0, 0.3);
    }
    select, textarea, button {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-family: inherit;
    }
    select {
      background-color: #2e1a47;
      color: #ffb347;
    }
    textarea {
      height: 100px;
      background-color: #1c1033;
      color: #fff;
      resize: none;
    }
    button {
      background: linear-gradient(90deg, #ff7e5f, #7f00ff);
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #ffb347;
    }
    .output {
      font-size: 18px;
      margin-top: 20px;
      color: #00ffcc;
      padding: 15px;
      border-radius: 10px;
      background-color: rgba(0,255,128,0.1);
    }
  </style>
</head>
<body>
  <h1>🌐 AI Multilingual Translator</h1>
  <div class="box">
    <form method="POST">
      <div>
        <label>From:</label><br>
        <select name="source_lang">
          {% for lang in languages %}
            <option value="{{lang}}" {% if lang == src_sel %}selected{% endif %}>{{lang}}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>To:</label><br>
        <select name="target_lang">
          {% for lang in languages %}
            <option value="{{lang}}" {% if lang == tgt_sel %}selected{% endif %}>{{lang}}</option>
          {% endfor %}
        </select>
      </div>
      <textarea name="text" placeholder="Enter your text here...">{{text}}</textarea><br>
      <button type="submit">⚡ Translate</button>
    </form>

    {% if translated_text %}
      <div class="output">
        <strong>Translation:</strong><br>{{ translated_text }}
      </div>
    {% endif %}
  </div>
</body>
</html>

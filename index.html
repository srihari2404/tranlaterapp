<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌏 AI Chinese ↔ English Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff8c00, #ff6f00, #ff9100);
      color: #fff;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 2.3em;
      background: linear-gradient(90deg, #fff, #ffe082);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    .box {
      background-color: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 15px;
      display: inline-block;
      width: 70%;
      box-shadow: 0 4px 25px rgba(0,0,0,0.3);
    }
    select, textarea, button {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-family: inherit;
    }
    select {
      background-color: #222;
      color: #ffb300;
    }
    textarea {
      height: 120px;
      background-color: #111;
      color: #fff;
      resize: none;
    }
    button {
      background: linear-gradient(90deg, #ffb300, #ff9100);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #ffb300;
    }
    .output {
      font-size: 18px;
      margin-top: 20px;
      color: #fff8e1;
      padding: 15px;
      border-radius: 10px;
      background-color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <h1>🌐 AI Chinese ↔ English Translator</h1>
  <div class="box">
    <form method="POST">
      <div>
        <label>Direction:</label><br>
        <select name="direction">
          {% for lang in languages %}
            <option value="{{languages[lang]}}" {% if languages[lang] == direction %}selected{% endif %}>{{lang}}</option>
          {% endfor %}
        </select>
      </div>
      <textarea name="text" placeholder="Enter your text here...">{{text}}</textarea><br>
      <button type="submit">⚡ Translate</button>
    </form>

    {% if translated_text %}
      <div class="output">
        <strong>Translation:</strong><br>{{ translated_text }}
      </div>
    {% endif %}
  </div>
</body>
</html>
